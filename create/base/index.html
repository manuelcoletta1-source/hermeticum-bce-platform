<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CREATE — IPR Base Fiscale (EU)</title>
  <meta name="description" content="Creazione IPR Base fiscale europeo. Dati bank-grade (CIE/passaporto/CF). Output: file reale + entry hash-only registry." />
  <link rel="stylesheet" href="/hermeticum-bce-platform/assets/hbce.css" />
  <script defer src="/hermeticum-bce-platform/assets/hbce-ui.js"></script>
  <script defer src="/hermeticum-bce-platform/assets/hbce-crypto.js"></script>
</head>
<body>
<div data-hbce="header"></div>

<main class="hbce-container hbce-main">

<section class="hbce-hero">
  <div class="hbce-hero__kicker">IPR BASE · FISCALE · BANK-GRADE</div>
  <h1 class="hbce-hero__title">Crea IPR Base (EU)</h1>
  <p class="hbce-hero__lead">
    Identità primaria fiscale europea.  
    Contiene dati reali (come banca).  
    Il file completo resta al cliente.  
    Nel registry pubblico va solo SHA256.
  </p>

  <div class="hbce-row" style="margin-top:18px">
    <a class="hbce-btn" href="/hermeticum-bce-platform/activate/">ACTIVATE</a>
    <a class="hbce-btn" href="/hermeticum-bce-platform/verify/">VERIFY</a>
    <a class="hbce-btn" href="/hermeticum-bce-platform/registry/">REGISTRY</a>
  </div>
</section>

<section class="hbce-grid">

<div class="hbce-card hbce-card--6">
<h2>Dati anagrafici</h2>

<div class="hbce-field">
<label>Nome</label>
<input id="nome" class="hbce-input" placeholder="Nome"/>
</div>

<div class="hbce-field">
<label>Cognome</label>
<input id="cognome" class="hbce-input" placeholder="Cognome"/>
</div>

<div class="hbce-field">
<label>Nickname</label>
<input id="nick" class="hbce-input" placeholder="Nickname operativo"/>
</div>

<div class="hbce-field">
<label>Codice fiscale</label>
<input id="cf" class="hbce-input" placeholder="Codice fiscale"/>
</div>

<div class="hbce-field">
<label>Documento</label>
<select id="doc" class="hbce-select">
<option value="CIE">Carta identità (CIE)</option>
<option value="PASSAPORTO">Passaporto</option>
</select>
</div>

<div class="hbce-field">
<label>Numero documento</label>
<input id="docnum" class="hbce-input" placeholder="Numero documento"/>
</div>

<div class="hbce-field">
<label>Residenza</label>
<input id="res" class="hbce-input" placeholder="Città / Stato"/>
</div>

<div class="hbce-field">
<label>Email</label>
<input id="email" class="hbce-input" placeholder="email"/>
</div>

<div class="hbce-row">
<button id="btnCreate" class="hbce-btn hbce-btn--primary">GENERA IPR BASE</button>
</div>

<div id="status" class="hbce-badge hbce-badge--warn" style="margin-top:12px">Waiting…</div>
</div>

<div class="hbce-card hbce-card--6">
<h2>Output</h2>

<div class="hbce-field">
<label>Registry entry (incolla)</label>
<pre id="entry" class="hbce-textarea"></pre>
</div>

<div class="hbce-row">
<button id="dlRelease" class="hbce-btn hbce-btn--ok" disabled>DOWNLOAD IPR_RELEASE.json</button>
<button id="dlReceipt" class="hbce-btn" disabled>DOWNLOAD RECEIPT.json</button>
<button id="copyEntry" class="hbce-btn" disabled>COPY ENTRY</button>
</div>

<pre id="raw" class="hbce-textarea" style="margin-top:12px"></pre>

</div>

</section>
</main>

<div data-hbce="footer"></div>

<script>
let RELEASE=null, RECEIPT=null, ENTRY=null;

document.getElementById("btnCreate").onclick=async()=>{

const nome=document.getElementById("nome").value.trim();
const cognome=document.getElementById("cognome").value.trim();
const nick=document.getElementById("nick").value.trim();
const cf=document.getElementById("cf").value.trim();
const doc=document.getElementById("doc").value;
const docnum=document.getElementById("docnum").value.trim();
const res=document.getElementById("res").value.trim();
const email=document.getElementById("email").value.trim();

if(!nome||!cognome||!cf){
alert("Nome cognome e CF obbligatori");
return;
}

const ts=new Date().toISOString();

RELEASE={
proto:"HBCE-IPR-FISCAL-v1",
kind:"IPR_BASE_FISCAL_FILE",
issuer:"HERMETICUM B.C.E. S.r.l.",
jurisdiction:"EU",
policy:["UE_FIRST","AUDIT_FIRST","FAIL_CLOSED","HASH_ONLY","APPEND_ONLY","GDPR_MIN"],
subject:{
nome,cognome,nickname:nick,
codice_fiscale:cf,
documento:doc,
numero_documento:docnum,
residenza:res,
email:email
},
issued_at:ts
};

const payload_sha256=await HBCE.sha256String(HBCE.stableStringify(RELEASE));
RELEASE.payload_sha256=payload_sha256;

ENTRY={
entity_type:"IPR_BASE",
name:nome+" "+cognome,
payload_sha256,
timestamp:ts,
status:"ACTIVE"
};

RECEIPT={
proto:"HBCE-RECEIPT-v1",
kind:"IPR_BASE_RECEIPT",
timestamp:ts,
payload_sha256,
note:"Append entry in registry.json"
};

document.getElementById("entry").textContent=JSON.stringify(ENTRY,null,2);
document.getElementById("raw").textContent=JSON.stringify(RELEASE,null,2);

document.getElementById("dlRelease").disabled=false;
document.getElementById("dlReceipt").disabled=false;
document.getElementById("copyEntry").disabled=false;

document.getElementById("dlRelease").onclick=()=>{
HBCE.download("HBCE_IPR_FISCAL_RELEASE.json",JSON.stringify(RELEASE,null,2));
};

document.getElementById("dlReceipt").onclick=()=>{
HBCE.download("HBCE_RECEIPT.json",JSON.stringify(RECEIPT,null,2));
};

document.getElementById("copyEntry").onclick=async()=>{
await navigator.clipboard.writeText(JSON.stringify(ENTRY,null,2));
alert("Entry copiata. Incollare nel registry.");
};

document.getElementById("status").className="hbce-badge hbce-badge--ok";
document.getElementById("status").textContent="IPR BASE GENERATED";
};
</script>
</body>
</html>
