<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create IPR — Hermeticum B.C.E.</title>

<style>
body{
font-family:Arial,Helvetica,sans-serif;
background:#0b0f14;
color:#e8eef7;
margin:0;
}

.container{
max-width:900px;
margin:auto;
padding:40px 20px;
}

h1{
font-size:32px;
margin-bottom:10px;
}

h2{
margin-top:40px;
}

input, select{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:20px;
background:#111827;
border:1px solid #2a3441;
color:#fff;
border-radius:6px;
}

button{
padding:14px 22px;
background:#00ffd5;
border:none;
color:#000;
font-weight:bold;
cursor:pointer;
border-radius:6px;
}

button:hover{
opacity:0.9;
}

.box{
background:#111827;
padding:20px;
margin-top:30px;
border-radius:8px;
border:1px solid #2a3441;
}

.footer{
margin-top:60px;
opacity:0.6;
font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>Create Identity Primary Record</h1>
<p>Activate a verifiable operational identity for human, company or AI system.</p>

<h2>1. Entity Type</h2>
<select id="type">
<option>Human</option>
<option>Company</option>
<option>AI System</option>
<option>Robot</option>
<option>Infrastructure Node</option>
</select>

<h2>2. Name / Entity ID</h2>
<input id="name" placeholder="Enter name or entity identifier">

<h2>3. Country</h2>
<input id="country" placeholder="EU Country">

<h2>4. Optional Email</h2>
<input id="email" placeholder="contact@email.com">

<button onclick="generateIPR()">Generate IPR</button>

<div class="box" id="result" style="display:none;">
<h2>IPR Generated</h2>
<p><b>Timestamp:</b> <span id="timestamp"></span></p>
<p><b>SHA256:</b></p>
<p id="hash"></p>

<button onclick="downloadIPR()">Download IPR File</button>
</div>

<div class="footer">
HERMETICUM B.C.E. — Operational Identity Infrastructure
</div>

</div>

<script>
let iprData = "";

async function sha256(message){
const msgBuffer = new TextEncoder().encode(message);
const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
const hashArray = Array.from(new Uint8Array(hashBuffer));
return hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function generateIPR(){

const type=document.getElementById("type").value;
const name=document.getElementById("name").value;
const country=document.getElementById("country").value;
const email=document.getElementById("email").value;

if(!name){alert("Insert name");return;}

const timestamp=new Date().toISOString();

const payload={
proto:"HBCE-IPR-v1",
type:type,
name:name,
country:country,
email:email,
timestamp:timestamp
};

const payloadString=JSON.stringify(payload);
const hash=await sha256(payloadString);

payload.sha256=hash;

iprData=JSON.stringify(payload,null,2);

document.getElementById("timestamp").innerText=timestamp;
document.getElementById("hash").innerText=hash;
document.getElementById("result").style.display="block";
}

function downloadIPR(){
const blob=new Blob([iprData],{type:"application/json"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="IPR_"+Date.now()+".json";
a.click();
}
</script>

</body>
</html>
