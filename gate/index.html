<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="dark"/>

<title>Execution Gate Demo — IPR</title>

<style>
:root{
 --bg:#0b0f14;
 --panel:#0f1620;
 --text:#e8eef7;
 --muted:#9fb0c3;
 --line:rgba(255,255,255,.08);
 --accent:#00ffe1;
 --danger:#ff3b6b;
 --ok:#3dff93;
 --r:18px;
}
body{
 margin:0;
 font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
 background:var(--bg);
 color:var(--text);
 display:flex;
 align-items:center;
 justify-content:center;
 height:100vh;
}
.box{
 width:520px;
 border:1px solid var(--line);
 border-radius:var(--r);
 padding:30px;
 background:rgba(15,22,32,.6);
}
h1{margin:0 0 20px;font-size:22px}
.status{
 padding:18px;
 border-radius:12px;
 margin-top:20px;
 text-align:center;
 font-weight:800;
}
.ok{background:rgba(61,255,147,.1);color:var(--ok);border:1px solid var(--ok)}
.fail{background:rgba(255,59,107,.1);color:var(--danger);border:1px solid var(--danger)}
button{
 padding:10px 14px;
 border-radius:10px;
 border:1px solid var(--line);
 background:rgba(255,255,255,.05);
 color:var(--text);
 margin-right:8px;
 cursor:pointer;
}
button:hover{border-color:var(--accent)}
pre{
 background:rgba(0,0,0,.4);
 padding:12px;
 border-radius:10px;
 font-size:13px;
 margin-top:16px;
}
</style>
</head>

<body>

<div class="box">
<h1>Execution Gate Simulation</h1>

<button onclick="run(true)">Simulate VALID Identity</button>
<button onclick="run(false)">Simulate INVALID Identity</button>

<div id="result"></div>

<pre>
identity_valid == true ? EXECUTE : BLOCK
failure_mode = FAIL_CLOSED
</pre>
</div>

<script>
function run(valid){
 const result = document.getElementById("result");
 if(valid){
   result.innerHTML = '<div class="status ok">EXECUTION AUTHORIZED</div>';
 }else{
   result.innerHTML = '<div class="status fail">EXECUTION BLOCKED (FAIL-CLOSED)</div>';
 }
}
</script>

</body>
</html>
