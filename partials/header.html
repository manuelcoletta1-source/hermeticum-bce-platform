<script>
  // Questo script gira dentro il partial: risolve il sigillo in base al basePath impostato nella pagina.
  (function(){
    const seal = document.querySelector('[data-hbce-seal]');
    const base = document.documentElement.getAttribute('data-base') || './';
    if (seal) seal.src = base + 'sigillo-hermeticum.svg';
    // Fix link: rende coerenti tutti gli href in base al basePath
    document.querySelectorAll('.navlinks a').forEach(a => {
      const href = a.getAttribute('href') || '';
      if (href.startsWith('./')) a.setAttribute('href', base + href.slice(2));
      else if (href === './') a.setAttribute('href', base);
    });
  })();
</script>
