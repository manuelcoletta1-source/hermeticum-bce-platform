<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HBCE Node Map</title>
<link rel="stylesheet" href="/hermeticum-bce-platform/assets/hbce.css">
</head>

<body>

<div data-hbce="header"></div>

<main class="hbce-container hbce-main">

<section class="hbce-hero">
<div class="hbce-hero__kicker">LIVE NODE NETWORK</div>
<h1 class="hbce-hero__title">HBCE Node Map</h1>
<p class="hbce-hero__lead">
European operational node network.
If registry source is invalid → FAIL-CLOSED.
</p>
</section>

<section class="hbce-section">
<h2 class="hbce-h2">Network status</h2>

<div class="hbce-meta">
<span class="hbce-badge" id="hbce_net_badge">
state: <strong id="hbce_badge_state">LOADING</strong>
</span>

<span class="hbce-badge">
nodes: <strong id="hbce_badge_nodes">—</strong>
</span>

<span class="hbce-badge">
countries: <strong id="hbce_badge_countries">—</strong>
</span>
</div>

</section>

<section class="hbce-section">
<div class="hbce-actions">
<a class="hbce-btn hbce-btn--primary" href="/hermeticum-bce-platform/deployment/">Deployment</a>
<a class="hbce-btn" href="/hermeticum-bce-platform/">Home</a>
</div>
</section>

</main>

<div data-hbce="footer"></div>
<script src="/hermeticum-bce-platform/assets/net-badge.js"></script>

</body>
</html>
