<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>EU-MAP — HBCE (Coverage)</title>
  <meta name="description" content="Mappa copertura HBCE: paese per paese (UE-first). Fail-closed se nodes.json non è verificabile." />

  <link rel="canonical" href="https://manuelcoletta1-source.github.io/hermeticum-bce-platform/network/eu-map/" />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#0b0f14" />

  <link rel="stylesheet" href="/hermeticum-bce-platform/assets/hbce.css" />
</head>

<body>
  <div data-hbce="header"></div>

  <main class="hbce-container hbce-main">

    <section class="hbce-hero">
      <div class="hbce-hero__kicker">EU-MAP · COVERAGE · FAIL-CLOSED</div>
      <h1 class="hbce-hero__title">EU Coverage Map</h1>
      <p class="hbce-hero__lead">
        Vista “country-first” della rete. Fonte: <code>deployment/nodes.json</code>. Se incoerente → <strong>FAIL-CLOSED</strong>.
      </p>

      <div class="hbce-actions">
        <a class="hbce-btn hbce-btn--primary" href="/hermeticum-bce-platform/network/">Torna a Network</a>
        <a class="hbce-btn" href="/hermeticum-bce-platform/deployment/nodes.json" target="_blank" rel="noopener">nodes.json</a>
      </div>

      <div class="hbce-card hbce-card--subtle" style="margin-top:14px;">
        <div class="hbce-card__title">Stato (runtime)</div>
        <div id="eu_state" class="hbce-card__text">—</div>
      </div>
    </section>

    <section class="hbce-section">
      <h2 class="hbce-h2">Countries</h2>

      <div class="hbce-card" style="overflow:auto;">
        <div class="hbce-card__title">Copertura per nazione</div>
        <table style="width:100%; border-collapse:collapse; margin-top:10px;">
          <thead>
            <tr style="text-align:left; border-bottom:1px solid rgba(255,255,255,.08);">
              <th style="padding:10px;">COUNTRY</th>
              <th style="padding:10px;">ACTIVE</th>
              <th style="padding:10px;">PILOT</th>
              <th style="padding:10px;">PLANNED</th>
              <th style="padding:10px;">LAST UPDATE</th>
            </tr>
          </thead>
          <tbody id="eu_tbody"></tbody>
        </table>
      </div>
    </section>

  </main>

  <div data-hbce="footer"></div>

  <script src="/hermeticum-bce-platform/assets/hbce-ui.js" defer></script>
  <script defer src="/hermeticum-bce-platform/network/eu-map/eu-map.js"></script>
</body>
</html>
