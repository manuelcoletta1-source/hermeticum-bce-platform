<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register (declassato) — percorso canonico</title>
  <meta name="description" content="Register declassato. Per emissione IPR usare il percorso canonico CREATE→RECEIPT→APPEND→VERIFY." />
  <link rel="stylesheet" href="/hermeticum-bce-platform/assets/hbce.css" />
</head>
<body>
  <div data-hbce="header"></div>

  <main class="hbce-container hbce-main">
    <section class="hbce-hero">
      <div class="hbce-hero__kicker">DECLASS NOTICE</div>
      <h1 class="hbce-hero__title">Register (declassato)</h1>
      <p class="hbce-hero__lead">
        Nessun onboarding alternativo. Emissione e verifica seguono un solo percorso (audit UE).
      </p>
      <div class="hbce-actions">
        <a class="hbce-btn" href="/hermeticum-bce-platform/create/">CREATE</a>
        <a class="hbce-btn hbce-btn--ghost" href="/hermeticum-bce-platform/create/receipt/">RECEIPT</a>
        <a class="hbce-btn hbce-btn--ghost" href="/hermeticum-bce-platform/registry/append/">APPEND</a>
        <a class="hbce-btn hbce-btn--ghost" href="/hermeticum-bce-platform/verify/">VERIFY</a>
      </div>
      <p class="hbce-note">UE-first · audit-first · fail-closed · hash-only · append-only</p>
    </section>
  </main>

  <div data-hbce="footer"></div>
  <script defer src="/hermeticum-bce-platform/assets/hbce-ui.js"></script>
</body>
</html>
