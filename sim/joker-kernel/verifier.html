<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HBCE Verifier — Evidence Pack v2</title>
<meta name="description" content="Offline-real verifier for HBCE Evidence Pack v2. Deterministic canonical SHA-512 root + ECDSA P-256 signature + append-only ledger validation."/>
<style>
:root{--bg:#0b0f14;--ink:#eaf2ff;--mut:rgba(234,242,255,.75);--g:#22c55e;--r:#ef4444;--line:rgba(255,255,255,.12)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu}
main{max-width:900px;margin:40px auto;padding:20px}
h1{font-size:1.6rem;margin-bottom:20px}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:rgba(255,255,255,.03)}
button{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#111;color:#fff;cursor:pointer;font-weight:600}
button:hover{background:#1a1a1a}
pre{overflow:auto;font-size:.8rem;background:#111;padding:10px;border-radius:8px}
.pass{color:var(--g);font-weight:900}
.fail{color:var(--r);font-weight:900}
</style>
</head>
<body>
<main>

<h1>HBCE Evidence Pack v2 — Independent Verifier</h1>

<div class="card">
<input type="file" id="fileInput" accept=".json"/>
<button onclick="verifyPack()">Verify</button>
<p id="result"></p>
<pre id="details"></pre>
</div>

</main>

<script>
async function sha512Hex(data){
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest("SHA-512", enc.encode(data));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

function canonicalStringify(obj){
  if(Array.isArray(obj)) return `[${obj.map(canonicalStringify).join(",")}]`;
  if(obj && typeof obj === "object"){
    return `{${Object.keys(obj).sort().map(k=>`"${k}":${canonicalStringify(obj[k])}`).join(",")}}`;
  }
  return JSON.stringify(obj);
}

async function verifyPack(){
  const file = document.getElementById("fileInput").files[0];
  if(!file) return;

  const text = await file.text();
  const pack = JSON.parse(text);

  const resultEl = document.getElementById("result");
  const detailsEl = document.getElementById("details");

  try{

    // Recompute canonical preimage
    const canonical = canonicalStringify(pack.payload);
    const computedRoot = await sha512Hex(canonical);

    const declaredRoot = pack.proof.pack_root_hash;
    const rootMatch = computedRoot === declaredRoot;

    // Verify signature
    const jwk = pack.proof.publicJwk;
    const key = await crypto.subtle.importKey(
      "jwk",
      jwk,
      {name:"ECDSA", namedCurve:"P-256"},
      false,
      ["verify"]
    );

    const sigBytes = Uint8Array.from(atob(pack.proof.signature), c=>c.charCodeAt(0));
    const dataBytes = new TextEncoder().encode(declaredRoot);

    const sigValid = await crypto.subtle.verify(
      {name:"ECDSA", hash:"SHA-256"},
      key,
      sigBytes,
      dataBytes
    );

    const overall = rootMatch && sigValid;

    if(overall){
      resultEl.textContent = "PASS";
      resultEl.className = "pass";

      // Persist root locally (fail-closed if not PASS)
      localStorage.setItem("HBCE_LAST_PACK_ROOT", declaredRoot);
      localStorage.setItem("HBCE_LAST_PACK_ROOT_TS", String(Date.now()));

    }else{
      resultEl.textContent = "FAIL";
      resultEl.className = "fail";
    }

    detailsEl.textContent =
`Computed Root: ${computedRoot}
Declared Root: ${declaredRoot}
Root Match: ${rootMatch}
Signature Valid: ${sigValid}
Overall: ${overall}`;

  }catch(err){
    resultEl.textContent = "FAIL";
    resultEl.className = "fail";
    detailsEl.textContent = err.toString();
  }
}
</script>

</body>
</html>
