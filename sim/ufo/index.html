<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HBCE SIM — UFO Approach Controller</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="stylesheet" href="/hermeticum-bce-platform/assets/hbce.css" />

<style>
  .sim-wrap{
    min-height: calc(100vh - 70px);
    display:grid;
    grid-template-columns: 1.3fr .7fr;
    gap:14px;
    padding: 22px 0 40px;
  }
  @media (max-width: 900px){ .sim-wrap{ grid-template-columns: 1fr; } }

  .stage{
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    background:
      radial-gradient(900px 700px at 20% 10%, rgba(120,160,255,.15), rgba(0,0,0,0)),
      radial-gradient(800px 600px at 120% 20%, rgba(255,60,120,.10), rgba(0,0,0,0)),
      #070a0f;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    min-height: 520px;
  }
  .stars{
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 10% 15%, rgba(255,255,255,.55) 0 1px, transparent 2px),
      radial-gradient(circle at 32% 75%, rgba(255,255,255,.45) 0 1px, transparent 2px),
      radial-gradient(circle at 66% 30%, rgba(255,255,255,.50) 0 1px, transparent 2px),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,.40) 0 1px, transparent 2px),
      radial-gradient(circle at 55% 55%, rgba(255,255,255,.35) 0 1px, transparent 2px),
      radial-gradient(circle at 25% 40%, rgba(255,255,255,.30) 0 1px, transparent 2px);
    opacity:.6;
    filter: blur(.2px);
    transform: translateZ(0);
  }

  .ufo{
    position:absolute;
    left:50%;
    top:55%;
    width: 180px;
    height: 120px;
    transform: translate(-50%,-50%) scale(.35);
    transform-origin: 50% 60%;
    will-change: transform, filter, opacity;
    opacity: 0;
    filter: drop-shadow(0 0 0 rgba(0,0,0,0));
    pointer-events:none;
  }
  .ufo.is-visible{ opacity:1; }

  .beam{
    position:absolute;
    left:50%;
    top:55%;
    width: 10px;
    height: 10px;
    transform: translate(-50%,-10%) scaleY(0);
    transform-origin: 50% 0%;
    opacity:0;
    pointer-events:none;
    background: linear-gradient(180deg, rgba(190,255,240,.0), rgba(190,255,240,.32), rgba(190,255,240,0));
    filter: blur(0.2px);
    border-radius: 999px;
  }

  .hud{
    position:absolute;
    left:12px;
    top:12px;
    padding:10px 12px;
    border-radius: 14px;
    border:1px solid rgba(255,255,255,.08);
    background: rgba(0,0,0,.35);
    backdrop-filter: blur(10px);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
    font-size: 12px;
    color: rgba(232,238,246,.85);
    line-height: 1.35;
  }
  .hud b{ color: rgba(232,238,246,.95); font-weight: 700; }
  .hud .row{ display:flex; gap:10px; }
  .hud .k{ width:92px; color: rgba(154,167,182,.95); }

  .panel{
    border:1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    background: rgba(255,255,255,.03);
    padding: 14px;
  }
  .panel h2{ margin:0 0 10px; font-size: 16px; }
  .panel p{ margin:0 0 12px; color: rgba(232,238,246,.78); font-size: 13px; }
  .panel .btns{ display:flex; gap:10px; flex-wrap:wrap; margin: 10px 0 14px; }

  .joy{
    width: 190px;
    height: 190px;
    border-radius: 999px;
    border:1px solid rgba(255,255,255,.10);
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.06), rgba(255,255,255,.02));
    position: relative;
    touch-action: none;
    user-select:none;
    -webkit-user-select:none;
  }
  .joy::after{
    content:"";
    position:absolute; inset: 18px;
    border-radius: 999px;
    border:1px dashed rgba(255,255,255,.10);
    opacity:.7;
  }
  .knob{
    width: 62px; height: 62px;
    position:absolute;
    left:50%; top:50%;
    transform: translate(-50%,-50%);
    border-radius: 999px;
    border:1px solid rgba(219,231,255,.30);
    background: linear-gradient(180deg, rgba(219,231,255,.12), rgba(255,255,255,.03));
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
  }
  .reads{
    margin-top: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
    font-size: 12px;
    color: rgba(232,238,246,.82);
  }
  .reads .r{ display:flex; justify-content:space-between; gap:10px; padding: 6px 0; border-top:1px solid rgba(255,255,255,.06); }
  .reads .r:first-child{ border-top:none; }

  .tiny{ font-size: 12px; color: rgba(154,167,182,.95); }
</style>
</head>

<body>
<header class="hbce-header">
  <div class="hbce-container hbce-header__inner">
    <a class="hbce-brand" href="/hermeticum-bce-platform/">HERMETICUM</a>
    <nav class="hbce-nav" aria-label="Primary">
      <a href="/hermeticum-bce-platform/">Home</a>
      <a href="/hermeticum-bce-platform/sim/">SIM</a>
      <a href="/hermeticum-bce-platform/verify/">Verify</a>
    </nav>
  </div>
</header>

<main class="hbce-container hbce-main">
  <div class="sim-wrap">

    <section class="stage" aria-label="UFO stage">
      <div class="stars"></div>

      <div class="hud">
        <div class="row"><span class="k">ENTITY</span> <b>UFO</b></div>
        <div class="row"><span class="k">STATE</span> <b id="st">IDLE</b></div>
        <div class="row"><span class="k">DIST</span> <b id="dist">∞</b></div>
        <div class="row"><span class="k">THRUST</span> <b id="thr">0.00</b></div>
        <div class="row"><span class="k">VECTOR</span> <b id="vec">0.00, 0.00</b></div>
      </div>

      <div class="beam" id="beam"></div>

      <svg class="ufo" id="ufo" viewBox="0 0 240 160" aria-hidden="true">
        <defs>
          <radialGradient id="g1" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="rgba(219,231,255,.85)"/>
            <stop offset="60%" stop-color="rgba(160,190,255,.30)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
          </radialGradient>
          <linearGradient id="g2" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,.35)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,.08)"/>
          </linearGradient>
          <linearGradient id="g3" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0%" stop-color="rgba(255,60,120,.35)"/>
            <stop offset="50%" stop-color="rgba(219,231,255,.25)"/>
            <stop offset="100%" stop-color="rgba(0,160,255,.28)"/>
          </linearGradient>
          <filter id="blur"><feGaussianBlur stdDeviation="1.2"/></filter>
        </defs>

        <ellipse cx="120" cy="95" rx="84" ry="50" fill="url(#g1)" filter="url(#blur)" opacity=".65"/>
        <ellipse cx="120" cy="92" rx="88" ry="28" fill="url(#g2)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
        <ellipse cx="120" cy="92" rx="74" ry="20" fill="rgba(0,0,0,.22)" stroke="rgba(255,255,255,.10)" stroke-width="1"/>
        <path d="M70 86 C82 52, 158 52, 170 86 C150 92, 90 92, 70 86Z"
              fill="rgba(219,231,255,.12)" stroke="rgba(219,231,255,.22)" stroke-width="2"/>
        <ellipse cx="120" cy="105" rx="92" ry="8" fill="url(#g3)" opacity=".35"/>
        <circle cx="86" cy="92" r="4.5" fill="rgba(255,255,255,.45)"/>
        <circle cx="120" cy="92" r="4.5" fill="rgba(255,255,255,.45)"/>
        <circle cx="154" cy="92" r="4.5" fill="rgba(255,255,255,.45)"/>
      </svg>
    </section>

    <aside class="panel">
      <h2>Controller</h2>
      <p>
        Press <b>SUMMON</b>, then push the joystick.
        Up = approach, Down = retreat.
      </p>

      <div class="btns">
        <button class="hbce-btn hbce-btn--primary" id="btnSummon" type="button">SUMMON</button>
        <button class="hbce-btn hbce-btn--secondary" id="btnHold" type="button">HOLD</button>
        <button class="hbce-btn" id="btnReset" type="button">RESET</button>
      </div>

      <div class="joy" id="joy" aria-label="Joystick">
        <div class="knob" id="knob"></div>
      </div>

      <div class="reads">
        <div class="r"><span class="tiny">Approach</span> <span id="rA">0.00</span></div>
        <div class="r"><span class="tiny">X</span> <span id="rX">0.00</span></div>
        <div class="r"><span class="tiny">Y</span> <span id="rY">0.00</span></div>
      </div>

      <p class="tiny" style="margin-top:12px">Mobile supported: drag the joystick with your thumb.</p>
    </aside>

  </div>
</main>

<script>
(function(){
  "use strict";

  const ufo  = document.getElementById("ufo");
  const beam = document.getElementById("beam");
  const stEl   = document.getElementById("st");
  const distEl = document.getElementById("dist");
  const thrEl  = document.getElementById("thr");
  const vecEl  = document.getElementById("vec");

  const joy  = document.getElementById("joy");
  const knob = document.getElementById("knob");

  const btnSummon = document.getElementById("btnSummon");
  const btnHold   = document.getElementById("btnHold");
  const btnReset  = document.getElementById("btnReset");

  const rA = document.getElementById("rA");
  const rX = document.getElementById("rX");
  const rY = document.getElementById("rY");

  let state = "IDLE"; // IDLE | ACTIVE | HOLD
  let visible = false;

  // stage-normalized coords
  let x = 0.50, y = 0.55, z = 0.08;
  let vx = 0, vy = 0, vz = 0;

  // joystick -1..1
  let jx = 0, jy = 0;
  let approach = 0;

  function setState(s){ state = s; stEl.textContent = s; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function fmt(n){ return (Math.round(n*100)/100).toFixed(2); }

  let dragging = false;
  function joyRect(){ return joy.getBoundingClientRect(); }

  function updateKnob(){
    const r = joyRect();
    const cx = r.width/2, cy = r.height/2;
    const max = (Math.min(r.width, r.height)/2) - 22;
    const px = cx + jx * max;
    const py = cy + jy * max;
    knob.style.left = px + "px";
    knob.style.top  = py + "px";
    knob.style.transform = "translate(-50%,-50%)";
  }

  function setJoyFromPointer(clientX, clientY){
    const r = joyRect();
    const cx = r.left + r.width/2;
    const cy = r.top + r.height/2;
    const dx = clientX - cx;
    const dy = clientY - cy;
    const max = (Math.min(r.width, r.height)/2) - 22;

    const nx = clamp(dx / max, -1, 1);
    const ny = clamp(dy / max, -1, 1);

    const dead = 0.08;
    jx = Math.abs(nx) < dead ? 0 : nx;
    jy = Math.abs(ny) < dead ? 0 : ny;

    updateKnob();
  }

  joy.addEventListener("pointerdown", (e)=>{
    dragging = true;
    joy.setPointerCapture(e.pointerId);
    setJoyFromPointer(e.clientX, e.clientY);
  });
  joy.addEventListener("pointermove", (e)=>{
    if(!dragging) return;
    setJoyFromPointer(e.clientX, e.clientY);
  });
  joy.addEventListener("pointerup", ()=>{
    dragging = false;
    jx = 0; jy = 0;
    updateKnob();
  });
  joy.addEventListener("pointercancel", ()=>{
    dragging = false;
    jx = 0; jy = 0;
    updateKnob();
  });

  btnSummon.addEventListener("click", ()=>{
    visible = true;
    ufo.classList.add("is-visible");
    beam.style.opacity = "0";
    beam.style.transform = "translate(-50%,-10%) scaleY(0)";
    setState("ACTIVE");
  });

  btnHold.addEventListener("click", ()=>{
    setState(state === "HOLD" ? "ACTIVE" : "HOLD");
    if(state === "HOLD"){ vx *= 0.15; vy *= 0.15; vz *= 0.15; }
  });

  btnReset.addEventListener("click", ()=>{
    visible = false;
    ufo.classList.remove("is-visible");
    beam.style.opacity = "0";
    beam.style.transform = "translate(-50%,-10%) scaleY(0)";
    x = 0.50; y = 0.55; z = 0.08;
    vx = 0; vy = 0; vz = 0;
    jx = 0; jy = 0;
    updateKnob();
    setState("IDLE");
  });

  let last = performance.now();
  function tick(now){
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;

    const mag = Math.sqrt(jx*jx + jy*jy);
    approach = clamp(mag, 0, 1);

    if(visible && state === "ACTIVE"){
      const accelXY = 0.9;
      const accelZ  = 1.2;
      const damping = 0.88;

      const forward = clamp((-jy + 0.15*approach), -1, 1);

      vx += jx * accelXY * dt;
      vy += jy * accelXY * dt;
      vz += forward * accelZ * dt;

      vx *= Math.pow(damping, dt*60);
      vy *= Math.pow(damping, dt*60);
      vz *= Math.pow(damping, dt*60);

      x += vx * dt;
      y += vy * dt;
      z += vz * dt;

      x = clamp(x, 0.08, 0.92);
      y = clamp(y, 0.18, 0.90);
      z = clamp(z, 0.05, 1.0);

      if(z > 0.72){
        const t = clamp((z - 0.72) / 0.28, 0, 1);
        beam.style.opacity = String(0.15 + t * 0.55);
        beam.style.width = (18 + t*42) + "px";
        beam.style.height = (120 + t*320) + "px";
        beam.style.transform = "translate(-50%,-10%) scaleY(1)";
      } else {
        beam.style.opacity = "0";
        beam.style.transform = "translate(-50%,-10%) scaleY(0)";
      }
    }

    if(state === "HOLD"){
      vx *= 0.86; vy *= 0.86; vz *= 0.86;
    }

    const px = (x * 100).toFixed(2) + "%";
    const py = (y * 100).toFixed(2) + "%";
    const scale = 0.25 + z * 1.10;
    const glow = Math.round(4 + z * 22);

    ufo.style.left = px;
    ufo.style.top  = py;
    ufo.style.transform = `translate(-50%,-50%) scale(${scale.toFixed(3)})`;
    ufo.style.filter = `drop-shadow(0 0 ${glow}px rgba(219,231,255,.18)) drop-shadow(0 0 ${Math.round(glow*0.6)}px rgba(255,60,120,.10))`;

    distEl.textContent = visible ? (1.0 - z).toFixed(3) : "∞";
    thrEl.textContent  = visible ? fmt(approach) : "0.00";
    vecEl.textContent  = `${fmt(jx)}, ${fmt(jy)}`;

    rA.textContent = fmt(approach);
    rX.textContent = fmt(jx);
    rY.textContent = fmt(jy);

    requestAnimationFrame(tick);
  }

  updateKnob();
  requestAnimationFrame(tick);
})();
</script>

</body>
</html>
