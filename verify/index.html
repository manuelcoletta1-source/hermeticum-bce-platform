<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify IPR — Hermeticum</title>

<style>
body{
font-family:Arial,Helvetica,sans-serif;
background:#0b0f14;
color:#e8eef7;
margin:0;
}

.container{
max-width:900px;
margin:auto;
padding:40px 20px;
}

input{
width:100%;
padding:14px;
background:#111827;
border:1px solid #2a3441;
color:#fff;
border-radius:6px;
margin-top:10px;
margin-bottom:20px;
}

button{
padding:14px 22px;
background:#00ffd5;
border:none;
color:#000;
font-weight:bold;
cursor:pointer;
border-radius:6px;
}

.box{
margin-top:30px;
padding:20px;
background:#111827;
border:1px solid #2a3441;
border-radius:8px;
}

.pass{color:#00ff9c;font-weight:bold;}
.fail{color:#ff4d4d;font-weight:bold;}
</style>
</head>

<body>
<div class="container">

<h1>Verify Identity Primary Record</h1>
<p>Insert payload SHA256 to verify registry presence.</p>

<input id="hash" placeholder="Paste payload SHA256">

<button onclick="verify()">Verify</button>

<div id="result" class="box" style="display:none;"></div>

</div>

<script>

async function verify(){

const hash=document.getElementById("hash").value.trim();
if(!hash){alert("Insert hash");return;}

const res=await fetch("../registry.json");
const data=await res.json();

let found=false;

for(let i=0;i<data.length;i++){
if(data[i].payload_sha256===hash){found=true;break;}
}

const box=document.getElementById("result");
box.style.display="block";

if(found){
box.innerHTML="<span class='pass'>VALID IPR — PRESENT IN REGISTRY</span>";
}else{
box.innerHTML="<span class='fail'>NOT FOUND — FAIL CLOSED</span>";
}

}

</script>
</body>
</html>
