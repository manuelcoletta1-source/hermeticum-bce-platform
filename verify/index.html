<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<title>VERIFY — IPR Public Verification</title>
<meta name="description" content="Verifica pubblica IPR. Se hash presente nel registry -> VALID." />

<link rel="stylesheet" href="/hermeticum-bce-platform/assets/hbce.css"/>
</head>

<body>
<div data-hbce="header"></div>

<main class="hbce-container hbce-main">

<section class="hbce-hero">
<div class="hbce-hero__kicker">VERIFY · PUBLIC</div>
<h1 class="hbce-hero__title">Verifica IPR</h1>
<p class="hbce-hero__lead">
Carica file IPR_RELEASE.  
Se hash presente nel registry → VALID.
</p>
</section>

<section class="hbce-section">
<h2>Carica file</h2>

<input type="file" id="fileInput" class="hbce-btn"/>
<pre class="hbce-pre" id="output">—</pre>
</section>

<section class="hbce-section" id="certBox" style="display:none;">
<h2>Certificato IPR (rilascio cliente)</h2>

<div class="hbce-actions">
<button class="hbce-btn" id="downloadJson">Download CERTIFICATO JSON</button>
<button class="hbce-btn hbce-btn--ghost" id="downloadTxt">Download CERTIFICATO TXT</button>
</div>

<pre class="hbce-pre" id="certPreview"></pre>
</section>

</main>
<div data-hbce="footer"></div>

<script>
const REGISTRY_URL="/hermeticum-bce-platform/registry/registry.json";
const VERIFY_URL="/hermeticum-bce-platform/verify/";

function hex(buffer){
return [...new Uint8Array(buffer)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function sha256(text){
const buf=new TextEncoder().encode(text);
const hash=await crypto.subtle.digest("SHA-256",buf);
return hex(hash);
}

function download(name,data,type){
const blob=new Blob([data],{type:type});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download=name;
a.click();
URL.revokeObjectURL(url);
}

document.getElementById("fileInput").addEventListener("change",async e=>{
const file=e.target.files[0];
if(!file)return;

const text=await file.text();
const json=JSON.parse(text);
const payload=json.payload;

const computed=await sha256(JSON.stringify(payload));
const name=json.name;
const ts=json.timestamp;

let registry=await fetch(REGISTRY_URL).then(r=>r.json());

let found=false;
if(registry.entries){
for(let e of registry.entries){
if(e.payload_sha256===computed) found=true;
}
}

let result=found?"VALID":"INVALID";

document.getElementById("output").textContent=
"RESULT: "+result+"\n"+
"Name: "+name+"\n"+
"Timestamp: "+ts+"\n"+
"payload_sha256: "+computed+"\n"+
"Registry match: "+(found?"YES":"NO");

if(result==="VALID"){
generateCert(name,ts,computed);
}
});

async function generateCert(name,ts,hash){

const cert={
proto:"HBCE-CERT-v1",
kind:"IPR_VALID_CERTIFICATE",
result:"VALID",
issued_at:new Date().toISOString(),
subject:{
name:name,
timestamp:ts,
payload_sha256:hash
},
registry:{
url:REGISTRY_URL,
match:true
},
verify:{
url:VERIFY_URL
}
};

const certText=JSON.stringify(cert,null,2);
const certHash=await sha256(certText);
cert.certificate_sha256=certHash;

const final=JSON.stringify(cert,null,2);

document.getElementById("certPreview").textContent=final;
document.getElementById("certBox").style.display="block";

document.getElementById("downloadJson").onclick=()=>{
download("IPR_CERT_"+name.replace(/ /g,"_")+".json",final,"application/json");
};

document.getElementById("downloadTxt").onclick=()=>{
download("IPR_CERT_"+name.replace(/ /g,"_")+".txt",final,"text/plain");
};
}
</script>

</body>
</html>
