<script>
(function(){
  const q = document.getElementById("q");
  const out = document.getElementById("out");

  function isSha256Hex(v){ return /^[a-f0-9]{64}$/i.test(v); }

  async function loadRegistry(){
    const r = await fetch("/hermeticum-bce-platform/registry/registry.json", { cache: "no-store" });
    if(!r.ok) throw new Error("REGISTRY_FETCH_FAILED");
    return await r.json();
  }

  async function lookup(sha){
    const reg = await loadRegistry();
    const entries = Array.isArray(reg.entries) ? reg.entries : [];
    return entries.find(e => (e.payload_sha256 || "").toLowerCase() === sha.toLowerCase()) || null;
  }

  let timer = null;

  q.addEventListener("input", () => {
    clearTimeout(timer);
    const v = (q.value || "").trim();

    if(!v){ out.textContent = "Nessun input."; return; }
    if(v.length < 16){ out.textContent = "INPUT_TOO_SHORT → INVALID"; return; }

    // Debounce per non martellare fetch
    timer = setTimeout(async () => {
      if(!isSha256Hex(v)){
        out.textContent = "FORMATO NON CLASSIFICATO → INVALID (usa payload_sha256 64-hex per lookup)";
        return;
      }
      out.textContent = "Lookup registry…";
      try{
        const hit = await lookup(v);
        if(hit){
          out.textContent = "PASS → presente nel registry (append-only). Nickname: " + (hit.nickname || "N/A");
        }else{
          out.textContent = "INVALID → non presente nel registry (append-only).";
        }
      }catch(e){
        out.textContent = "INVALID → registry non accessibile (fail-closed).";
      }
    }, 350);
  });
})();
</script>
